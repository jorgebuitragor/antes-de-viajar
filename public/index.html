<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Listas de la casa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}

/* Layout: una etiqueta de equipaje como encabezado, pestañas de listas, y debajo la lista en una sola columna estrecha */
:root{
  --bg:#E9EEF0; --card:#FFFFFF; --ink:#13262D; --muted:#5B6B71; --line:#D3DCDF;
  --accent:#E3A21A; --accent-ink:#2A1C00; --done:#2F7D5B;
  --mafer:#9A3F72; --jorge:#1D6C8C; --ambos:#5E4BB3; --on-person:#FFFFFF;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1E; --card:#17252A; --ink:#E6EEF0; --muted:#94A6AC; --line:#2A3B41;
  --accent:#F0B433; --accent-ink:#231700; --done:#5BBF8E;
  --mafer:#E58BC0; --jorge:#6CC0E3; --ambos:#B3A6F2; --on-person:#0F1A1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1E; --card:#17252A; --ink:#E6EEF0; --muted:#94A6AC; --line:#2A3B41;
  --accent:#F0B433; --accent-ink:#231700; --done:#5BBF8E;
  --mafer:#E58BC0; --jorge:#6CC0E3; --ambos:#B3A6F2; --on-person:#0F1A1E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}

/* Etiqueta de encabezado */
.tag{position:relative;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:22px 92px 20px 64px;display:flex;flex-direction:column;gap:6px}
.tag::before{content:"";position:absolute;left:22px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.tag .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.75}
.tag h1{font-family:var(--f-display);font-size:clamp(28px,7vw,38px);line-height:1.05;margin:0;font-weight:800;text-wrap:balance;overflow-wrap:anywhere}
.tagtools{position:absolute;top:10px;right:10px;display:flex;gap:2px}
.tt{border:0;background:transparent;color:var(--accent-ink);opacity:.7;width:36px;height:36px;border-radius:8px;cursor:pointer;display:grid;place-content:center}
.tt:hover:not(:disabled){opacity:1;background:rgba(0,0,0,.1)}
.tt:disabled{opacity:.25;cursor:not-allowed}
.meter{display:flex;align-items:center;gap:12px;margin-top:8px}
.bar{flex:1;height:8px;border-radius:99px;background:rgba(0,0,0,.15);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent-ink);border-radius:99px;transition:width .3s ease}
.count{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}
.split{font-size:14px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 14px}
.split b{font-weight:700}

/* Pestañas de listas */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-block:-8px -4px;scrollbar-width:thin}
.tab{flex:none;font:inherit;font-weight:700;font-size:14px;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab:hover{border-color:var(--muted);color:var(--ink)}
.tab[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab .n{font-size:12px;font-variant-numeric:tabular-nums;min-width:20px;padding:1px 6px;border-radius:99px;background:var(--line);color:var(--ink);text-align:center}
.tab[aria-current="true"] .n{background:var(--accent);color:var(--accent-ink)}
.tab.new{border-style:dashed;background:transparent}

/* Filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters input,.filters select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.filters input{flex:1 1 100%}
.filters select{flex:1}
.filters .ghost{padding:10px 12px}
.found{color:var(--muted);font-size:14px;margin-top:-14px}

/* Lista */
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
ul.sorting{overflow:visible;user-select:none;-webkit-user-select:none}
li{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 14px;border-top:1px solid var(--line);background:var(--card)}
li:first-child{border-top:0}
li label{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding-block:12px;cursor:pointer}
li input[type=checkbox]{appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;display:grid;place-content:center;cursor:pointer;margin:0;background:transparent}
li input[type=checkbox]::after{content:"";width:12px;height:7px;border-left:3px solid var(--card);border-bottom:3px solid var(--card);transform:translateY(-2px) rotate(-45deg);opacity:0}
li input[type=checkbox]:checked{background:var(--done);border-color:var(--done)}
li input[type=checkbox]:checked::after{opacity:1}
li .txt{overflow-wrap:anywhere}
li.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
li .editbox{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--accent);border-radius:8px;padding:9px 10px;margin-block:6px}
li.dragging{position:relative;z-index:5;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.3);outline:2px solid var(--accent);border-top-color:transparent;cursor:grabbing}
.grip{flex:none;width:28px;height:36px;margin-left:-8px;border:0;background:transparent;color:var(--muted);border-radius:8px;cursor:grab;touch-action:none;display:grid;place-content:center;opacity:.65}
.grip:hover{opacity:1;background:var(--bg)}
ul.filtered .grip{display:none}
.edit,.del{flex:none;border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:8px;line-height:1;cursor:pointer;opacity:.55}
.edit{font-size:17px}
.del{font-size:20px}
.edit:hover,.del:hover{opacity:1;background:var(--bg)}
.empty{padding:22px 16px;color:var(--muted);text-align:center}

/* Responsable */
.who{flex:none;display:flex;gap:4px}
.who button{font:inherit;font-size:13px;font-weight:700;padding:5px 9px;border-radius:99px;cursor:pointer;background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.who button[data-p="Mafer"]:hover{border-color:var(--mafer);color:var(--mafer)}
.who button[data-p="Jorge"]:hover{border-color:var(--jorge);color:var(--jorge)}
.who button[data-p="Ambos"]:hover{border-color:var(--ambos);color:var(--ambos)}
.who button[aria-pressed="true"][data-p="Mafer"]{background:var(--mafer);border-color:var(--mafer);color:var(--on-person)}
.who button[aria-pressed="true"][data-p="Jorge"]{background:var(--jorge);border-color:var(--jorge);color:var(--on-person)}
.who button[aria-pressed="true"][data-p="Ambos"]{background:var(--ambos);border-color:var(--ambos);color:var(--on-person)}

/* Agregar y pie */
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.add select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 10px}
.add button,.ghost{font:inherit;font-weight:700;border-radius:10px;padding:12px 16px;cursor:pointer}
.add button{border:0;background:var(--ink);color:var(--bg)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:400;padding:8px 12px}
.status{min-height:1.2em}
:is(button,input,select,.grip):focus-visible{outline:3px solid var(--accent);outline-offset:2px}
li .editbox:focus-visible{outline-offset:1px}

/* Diálogos */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:22px;width:min(400px,calc(100vw - 32px));font-family:var(--f-body)}
dialog::backdrop{background:rgba(10,20,24,.55)}
dialog h2{font-family:var(--f-display);font-size:22px;line-height:1.1;margin:0 0 8px}
dialog p{margin:0 0 18px;color:var(--muted);overflow-wrap:anywhere}
dialog p b{color:var(--ink)}
dialog .actions{display:flex;justify-content:flex-end;gap:8px}
dialog .actions.rev{flex-direction:row-reverse;justify-content:flex-start}
dialog button{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;cursor:pointer}
dialog .cancel{background:transparent;border:1px solid var(--line);color:var(--ink)}
dialog .danger{background:#C0392B;border:1px solid #C0392B;color:#fff}
dialog .primary{background:var(--ink);border:1px solid var(--ink);color:var(--bg)}
.field{display:grid;gap:6px;margin:0 0 12px;font-size:14px;color:var(--muted)}
.field input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}
.ideas{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
dialog .ideas button{font-weight:400;font-size:14px;padding:5px 11px;border-radius:99px;background:transparent;border:1px solid var(--line);color:var(--muted)}
dialog .ideas button:hover{color:var(--ink);border-color:var(--muted)}

/* Mascotas sentadas sobre la etiqueta */
.pets{display:flex;justify-content:flex-end;padding-right:10px;margin-bottom:-30px;position:relative;z-index:1;pointer-events:none}
.pets svg{display:block;width:min(340px,94%);height:auto;overflow:visible}
.dog-tail{animation:wag 1.1s ease-in-out infinite}
.cat-tail{animation:sway 3.8s ease-in-out infinite}
#p-orange .cat-tail{animation-delay:-1.6s;animation-duration:4.4s}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes wag{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(15deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(6deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@media (prefers-reduced-motion: reduce){.bar span{transition:none}.dog-tail,.cat-tail,.blink{animation:none}}

@media (max-width:480px){
  .tag{padding-left:56px}
  .tag::before{left:18px}
  li{flex-wrap:wrap;gap:0 4px}
  li label,li .editbox{flex:1 1 calc(100% - 116px)}
  li .who{order:4;flex-basis:100%;padding:0 0 10px 62px}
}
@media (max-width:420px){.who button{padding:5px 7px;font-size:12px}.add{flex-wrap:wrap}.add input{flex-basis:100%}.add select{flex:1}}
</style>
</head>

  <header class="tag">
    <span class="eyebrow">Listas de la casa</span>
    <h1 id="listName">…</h1>
    <div class="meter"><div class="bar"><span id="bar" style="width:0%"></span></div><span class="count" id="count">…</span></div>
    <div class="split" id="split"></div>
    <div class="tagtools">
      <button class="tt" type="button" id="renameList" aria-label="Renombrar lista" title="Renombrar lista"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      <button class="tt" type="button" id="deleteList" aria-label="Eliminar lista" title="Eliminar lista"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Listas"></nav>
  <div class="filters" id="filters" role="search">
    <input id="q" type="search" placeholder="Buscar en esta lista" autocomplete="off" aria-label="Buscar en esta lista">
    <select id="fState" aria-label="Filtrar por estado"><option value="">Todos</option><option value="open">Pendientes</option><option value="done">Hechos</option></select>
    <select id="fWho" aria-label="Filtrar por responsable"><option value="">Todos</option><option value="Mafer">Mafer</option><option value="Jorge">Jorge</option><option value="Ambos">Ambos</option><option value="none">Sin asignar</option></select>
    <button class="ghost" type="button" id="clearF" hidden>Limpiar</button>
  </div>
  <div class="found" id="found" aria-live="polite" hidden></div>
  <ul id="list"></ul>
  <form class="add" id="addForm">
    <input id="newItem" type="text" placeholder="Agregar a esta lista" autocomplete="off" aria-label="Nuevo ítem">
    <select id="newWho" aria-label="Responsable del nuevo ítem"><option value="">Sin asignar</option><option value="Mafer">Mafer</option><option value="Jorge">Jorge</option><option value="Ambos">Ambos</option></select>
    <button type="submit">Agregar</button>
  </form>
  <div class="foot">
    <span class="status" id="status" aria-live="polite"></span>
    <button class="ghost" type="button" id="reset">Desmarcar todo</button>
  </div>
</div>

<dialog id="confirmDlg" aria-labelledby="cdTitle">
  <form method="dialog">
    <h2 id="cdTitle">¿Eliminar?</h2>
    <p id="cdMsg"></p>
    <div class="actions">
      <button class="cancel" value="cancel" autofocus>Cancelar</button>
      <button class="danger" value="ok" id="cdOk">Eliminar</button>
    </div>
  </form>
</dialog>

<dialog id="listDlg" aria-labelledby="ldTitle">
  <form method="dialog">
    <h2 id="ldTitle">Nueva lista</h2>
    <label class="field"><span>Nombre de la lista</span><input id="ldName" required maxlength="60" autocomplete="off"></label>
    <div class="ideas" id="ldIdeas" aria-label="Ideas de listas"></div>
    <div class="actions rev">
      <button class="primary" value="ok" id="ldOk">Crear</button>
      <button class="cancel" value="cancel" formnovalidate>Cancelar</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  var lists = [], lastJson = '', busy = 0, cur = null;
  var editingId = null, drag = null, kbPending = false, kbTimer = 0, focusGrip = null;
  var confirmCb = null, listMode = 'new';
  var PEOPLE = ['Mafer','Jorge','Ambos'];
  var IDEAS = ['Súper','Pendientes de la casa','Mascotas','Regalos','Viaje','Pendientes del mes'];
  var GRIP = '<svg width="12" height="18" viewBox="0 0 12 18" aria-hidden="true"><g fill="currentColor"><circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/><circle cx="3" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="3" cy="15" r="1.6"/><circle cx="9" cy="15" r="1.6"/></g></svg>';
  var $ = function(id){ return document.getElementById(id); };
  var list = $('list'), statusEl = $('status'), tabs = $('tabs');
  var q = $('q'), fState = $('fState'), fWho = $('fWho');
  var confirmDlg = $('confirmDlg'), listDlg = $('listDlg');

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function say(t){ statusEl.textContent = t; }
  function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }

  function api(method, path, body){
    return fetch('/api' + path, {
      method: method,
      headers: body ? {'Content-Type':'application/json'} : undefined,
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
  }
  var lp = function(id){ return '/lists/' + encodeURIComponent(id); };
  var ip = function(lid, iid){ return lp(lid) + '/items' + (iid ? '/' + encodeURIComponent(iid) : ''); };

  function curList(){ return lists.filter(function(l){ return l.id === cur; })[0] || null; }
  function itemsOf(){ var l = curList(); return l ? l.items : []; }
  function find(id){ return itemsOf().filter(function(i){ return i.id === id; })[0]; }

  /* ---------- filtros ---------- */
  function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
  function filtersOn(){ return !!(q.value.trim() || fState.value || fWho.value); }
  function matches(it){
    var t = norm(q.value.trim());
    if (t && norm(it.t).indexOf(t) < 0) return false;
    if (fState.value==='open' && it.d) return false;
    if (fState.value==='done' && !it.d) return false;
    if (fWho.value==='none') return !it.r;
    if (fWho.value && it.r!==fWho.value) return false;
    return true;
  }
  function resetFilters(){ q.value = ''; fState.value = ''; fWho.value = ''; }

  /* ---------- render ---------- */
  function renderTabs(){
    tabs.innerHTML = lists.map(function(l){
      var open = l.items.filter(function(i){ return !i.d; }).length;
      return '<button class="tab" type="button" data-id="'+esc(l.id)+'" aria-current="'+(l.id===cur)+'">'+esc(l.name)+'<span class="n" aria-label="'+open+' pendientes">'+open+'</span></button>';
    }).join('') + '<button class="tab new" id="newList" type="button">+ Nueva lista</button>';
  }

  function renderHeader(){
    var l = curList(), its = itemsOf();
    $('listName').textContent = l ? l.name : '…';
    document.title = (l ? l.name + ' · ' : '') + 'Listas de la casa';
    $('deleteList').disabled = lists.length < 2;
    var n = its.length, k = its.filter(function(i){ return i.d; }).length;
    $('count').textContent = !n ? 'Lista vacía' : (k===n ? '¡Todo listo!' : k+' de '+n+' hechos');
    $('bar').style.width = (n ? Math.round(k/n*100) : 0)+'%';
    var parts = PEOPLE.map(function(p){
      var mine = its.filter(function(i){ return i.r===p; });
      if (p==='Ambos' && !mine.length) return '';
      return '<span><b>'+p+'</b> '+mine.filter(function(i){return i.d;}).length+'/'+mine.length+'</span>';
    });
    var free = its.filter(function(i){ return !i.r; }).length;
    if (free) parts.push('<span>Sin asignar '+free+'</span>');
    $('split').innerHTML = parts.join('');
  }

  function rowHtml(it){
    var body = (it.id===editingId)
      ? '<input class="editbox" type="text" maxlength="200" value="'+esc(it.t)+'" aria-label="Editar ítem">'
      : '<label><input type="checkbox" id="c-'+esc(it.id)+'"'+(it.d?' checked':'')+'><span class="txt">'+esc(it.t)+'</span></label>';
    return '<li class="'+(it.d?'done':'')+'" data-id="'+esc(it.id)+'">'+
      '<button class="grip" type="button" aria-label="Mover: '+esc(it.t)+'. Arrastra, o usa las flechas arriba y abajo" aria-keyshortcuts="ArrowUp ArrowDown">'+GRIP+'</button>'+body+
      '<div class="who" role="group" aria-label="Responsable">'+PEOPLE.map(function(p){
        return '<button type="button" data-p="'+p+'" aria-pressed="'+(it.r===p)+'">'+p+'</button>';
      }).join('')+'</div>'+
      '<button class="edit" type="button" aria-label="Editar: '+esc(it.t)+'">✎</button>'+
      '<button class="del" type="button" aria-label="Quitar: '+esc(it.t)+'">×</button></li>';
  }

  function renderList(){
    var its = itemsOf(), shown = its.filter(matches), f = filtersOn();
    list.classList.toggle('filtered', f);
    var found = $('found');
    found.hidden = !f; $('clearF').hidden = !f;
    if (f) found.textContent = shown.length+' de '+its.length+(its.length===1?' ítem':' ítems');
    if (!its.length) list.innerHTML = '<li class="empty">Esta lista está vacía. Agrega el primer ítem abajo.</li>';
    else if (!shown.length) list.innerHTML = '<li class="empty">Nada coincide con la búsqueda o los filtros.</li>';
    else list.innerHTML = shown.map(rowHtml).join('');
    var ed = list.querySelector('.editbox');
    if (ed && !ed.dataset.ready){ ed.dataset.ready = 1; ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length); }
    if (focusGrip){
      var g = list.querySelector('li[data-id="'+focusGrip+'"] .grip'); if (g) g.focus();
      focusGrip = null;
    }
  }

  function renderAll(){ renderTabs(); renderHeader(); renderList(); }

  /* ---------- estado ---------- */
  function pickInitial(){
    var h = decodeURIComponent(location.hash.slice(1)), s = store('adv-list');
    var ids = lists.map(function(l){ return l.id; });
    if (ids.indexOf(h) >= 0) return h;
    if (ids.indexOf(s) >= 0) return s;
    return ids[0] || null;
  }
  function setCur(id){
    cur = id; editingId = null; resetFilters();
    if (id){ store('adv-list', id); try { history.replaceState(null, '', '#'+encodeURIComponent(id)); } catch (e) {} }
  }
  function adopt(d){
    lastJson = JSON.stringify(d.lists); lists = d.lists;
    if (!curList()) setCur(pickInitial());
    if (editingId === null && !drag) renderAll();
  }
  function apply(next){ if (JSON.stringify(next) !== lastJson) adopt({lists: next}); }

  function load(){
    if (busy || kbPending || drag) return;
    api('GET','/lists').then(function(d){ apply(d.lists); say(''); })
      .catch(function(){ say('Sin conexión con el servidor. Reintentando…'); });
  }
  // Cambio local inmediato, luego se confirma con el servidor.
  function change(request){
    busy++;
    request.then(function(d){ adopt(d); say(''); })
      .catch(function(){ say('No se pudo guardar. Revisa la conexión y vuelve a intentarlo.'); load(); })
      .then(function(){ busy--; });
  }

  /* ---------- diálogos ---------- */
  [confirmDlg, listDlg].forEach(function(d){
    d.addEventListener('click', function(e){ // clic en el fondo oscuro cierra
      if (e.target !== d) return;
      var r = d.getBoundingClientRect();
      if (e.clientX<r.left || e.clientX>r.right || e.clientY<r.top || e.clientY>r.bottom) d.close('cancel');
    });
  });
  function askConfirm(title, msgHtml, label, cb){
    $('cdTitle').textContent = title; $('cdMsg').innerHTML = msgHtml; $('cdOk').textContent = label;
    confirmCb = cb; confirmDlg.returnValue = ''; confirmDlg.showModal();
  }
  confirmDlg.addEventListener('close', function(){
    var cb = confirmCb; confirmCb = null;
    if (confirmDlg.returnValue === 'ok' && cb) cb();
  });

  function openListDlg(mode){
    listMode = mode;
    var l = curList();
    $('ldTitle').textContent = mode==='new' ? 'Nueva lista' : 'Renombrar lista';
    $('ldOk').textContent = mode==='new' ? 'Crear' : 'Guardar';
    $('ldName').value = mode==='new' ? '' : (l ? l.name : '');
    var ideas = $('ldIdeas'); ideas.hidden = mode !== 'new';
    ideas.innerHTML = IDEAS.map(function(t){ return '<button type="button">'+esc(t)+'</button>'; }).join('');
    listDlg.returnValue = ''; listDlg.showModal(); $('ldName').focus(); $('ldName').select();
  }
  $('ldIdeas').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    $('ldName').value = b.textContent; $('ldName').focus();
  });
  listDlg.addEventListener('close', function(){
    if (listDlg.returnValue !== 'ok') return;
    var name = $('ldName').value.trim(); if (!name) return;
    if (listMode === 'new'){
      busy++;
      api('POST','/lists',{name:name}).then(function(d){ setCur(d.id); adopt(d); say(''); })
        .catch(function(){ say('No se pudo crear la lista.'); load(); })
        .then(function(){ busy--; });
    } else if (cur){
      var l = curList(); if (l) l.name = name; renderAll();
      change(api('PATCH', lp(cur), {name:name}));
    }
  });

  /* ---------- pestañas y lista ---------- */
  tabs.addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if (!b) return;
    if (b.id === 'newList') return openListDlg('new');
    if (b.dataset.id === cur) return;
    setCur(b.dataset.id); renderAll();
    var a = tabs.querySelector('.tab[aria-current="true"]');
    if (a && a.scrollIntoView) a.scrollIntoView({inline:'nearest', block:'nearest'});
  });
  window.addEventListener('hashchange', function(){
    var id = decodeURIComponent(location.hash.slice(1));
    if (id !== cur && lists.some(function(l){ return l.id === id; })){ setCur(id); renderAll(); }
  });
  $('renameList').addEventListener('click', function(){ if (curList()) openListDlg('rename'); });
  $('deleteList').addEventListener('click', function(){
    var l = curList(); if (!l || lists.length < 2) return;
    var n = l.items.length;
    askConfirm('¿Eliminar lista?',
      'Se eliminará <b>«'+esc(l.name)+'»</b>'+(n ? ' con '+n+(n===1?' ítem':' ítems') : '')+' para todos. No se puede deshacer.',
      'Eliminar lista', function(){ change(api('DELETE', lp(l.id))); });
  });

  list.addEventListener('change', function(e){
    var li = e.target.closest('li'); var it = li && find(li.dataset.id); if (!it) return;
    it.d = e.target.checked; renderAll();
    change(api('PATCH', ip(cur, it.id), {d:it.d}));
  });
  list.addEventListener('click', function(e){
    var w = e.target.closest('.who button');
    if (w){
      var it = find(w.closest('li').dataset.id); if (!it) return;
      it.r = (it.r===w.dataset.p) ? '' : w.dataset.p; renderAll();
      change(api('PATCH', ip(cur, it.id), {r:it.r}));
      return;
    }
    var ebtn = e.target.closest('.edit');
    if (ebtn){ editingId = ebtn.closest('li').dataset.id; renderList(); return; }
    var b = e.target.closest('.del'); if (!b) return;
    var id = b.closest('li').dataset.id, del = find(id), lid = cur; if (!del) return;
    askConfirm('¿Eliminar ítem?', 'Se quitará <b>«'+esc(del.t)+'»</b> de la lista para todos. No se puede deshacer.', 'Eliminar', function(){
      var l = curList(); if (l && l.id === lid) l.items = l.items.filter(function(i){ return i.id!==id; });
      renderAll();
      change(api('DELETE', ip(lid, id)));
    });
  });

  function finishEdit(save){
    var id = editingId; if (id===null) return;
    var box = list.querySelector('.editbox'), it = find(id);
    var t = box ? box.value.trim() : '';
    editingId = null;
    if (save && it && t && t!==it.t){
      it.t = t; renderAll();
      change(api('PATCH', ip(cur, id), {t:t}));
    } else { lastJson = ''; renderAll(); load(); }
  }
  list.addEventListener('keydown', function(e){
    if (e.target.classList.contains('editbox')){
      if (e.key==='Enter'){ e.preventDefault(); finishEdit(true); }
      else if (e.key==='Escape'){ e.preventDefault(); finishEdit(false); }
      return;
    }
    if (e.target.classList.contains('grip') && (e.key==='ArrowUp' || e.key==='ArrowDown')){
      e.preventDefault(); moveByKey(e.target.closest('li').dataset.id, e.key==='ArrowUp' ? -1 : 1);
    }
  });
  list.addEventListener('focusout', function(e){
    if (e.target.classList.contains('editbox') && editingId!==null) finishEdit(true);
  });
  [q, fState, fWho].forEach(function(el){ el.addEventListener('input', renderList); });
  $('clearF').addEventListener('click', function(){ resetFilters(); renderList(); });

  /* ---------- reordenar ---------- */
  function commitOrder(lid, ids){
    var l = lists.filter(function(x){ return x.id===lid; })[0]; if (!l) return;
    var by = {}; l.items.forEach(function(i){ by[i.id] = i; });
    l.items = ids.map(function(id){ return by[id]; }).filter(Boolean)
      .concat(l.items.filter(function(i){ return ids.indexOf(i.id) < 0; }));
    change(api('PUT', lp(lid) + '/order', {ids: ids}));
  }

  function moveByKey(id, dir){
    var l = curList(); if (!l) return;
    var ids = l.items.map(function(i){ return i.id; }), i = ids.indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= ids.length) return;
    ids.splice(j, 0, ids.splice(i, 1)[0]);
    var by = {}; l.items.forEach(function(x){ by[x.id] = x; });
    l.items = ids.map(function(x){ return by[x]; });
    focusGrip = id; kbPending = true; renderAll();
    say('Posición '+(j+1)+' de '+ids.length);
    var lid = l.id; clearTimeout(kbTimer);
    kbTimer = setTimeout(function(){ kbPending = false; commitOrder(lid, ids); }, 350);
  }

  var scrollTimer = 0;
  function dragMove(y){
    var li = drag.li;
    li.style.transform = 'translateY('+(y - drag.startY)+'px)';
    for (;;){
      var r = li.getBoundingClientRect(), mid = r.top + r.height/2;
      var nx = li.nextElementSibling, pv = li.previousElementSibling, nr, pr;
      if (nx && (nr = nx.getBoundingClientRect(), mid > nr.top + nr.height/2)){
        li.parentNode.insertBefore(li, nx.nextSibling); drag.startY += nr.height;
      } else if (pv && (pr = pv.getBoundingClientRect(), mid < pr.top + pr.height/2)){
        li.parentNode.insertBefore(li, pv); drag.startY -= pr.height;
      } else break;
      li.style.transform = 'translateY('+(y - drag.startY)+'px)';
    }
  }
  function dragEnd(save){
    if (!drag) return;
    var d = drag; drag = null; clearInterval(scrollTimer);
    d.li.classList.remove('dragging'); d.li.style.transform = ''; list.classList.remove('sorting');
    var ids = [].slice.call(list.children).map(function(li){ return li.dataset.id; }).filter(Boolean);
    var before = itemsOf().map(function(i){ return i.id; });
    if (save && JSON.stringify(ids) !== JSON.stringify(before)){ commitOrder(cur, ids); renderAll(); }
    else { lastJson = ''; renderAll(); load(); }
  }
  list.addEventListener('pointerdown', function(e){
    var g = e.target.closest('.grip');
    if (!g || e.button > 0 || drag || filtersOn()) return;
    e.preventDefault();
    var li = g.closest('li');
    g.setPointerCapture(e.pointerId);
    drag = {li: li, startY: e.clientY, pid: e.pointerId, y: e.clientY};
    li.classList.add('dragging'); list.classList.add('sorting');
    scrollTimer = setInterval(function(){ // autoscroll cerca de los bordes
      if (!drag) return;
      var dy = drag.y < 80 ? -14 : (drag.y > innerHeight - 80 ? 14 : 0);
      if (dy){ scrollBy(0, dy); drag.startY -= dy; dragMove(drag.y); }
    }, 30);
  });
  list.addEventListener('pointermove', function(e){
    if (!drag || e.pointerId !== drag.pid) return;
    drag.y = e.clientY; dragMove(e.clientY);
  });
  list.addEventListener('pointerup', function(e){ if (drag && e.pointerId === drag.pid) dragEnd(true); });
  list.addEventListener('pointercancel', function(e){ if (drag && e.pointerId === drag.pid) dragEnd(false); });

  /* ---------- agregar / reset ---------- */
  $('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    var inp = $('newItem'), t = inp.value.trim();
    if (!t || !cur) return;
    inp.value = '';
    change(api('POST', ip(cur), {t:t, r:$('newWho').value}));
  });
  $('reset').addEventListener('click', function(){
    if (!cur) return;
    itemsOf().forEach(function(i){ i.d = false; }); renderAll();
    change(api('POST', lp(cur) + '/reset'));
  });

  load();
  setInterval(load, 5000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
})();
</script>
</body>
</html>
