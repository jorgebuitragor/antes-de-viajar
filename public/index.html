<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Antes de viajar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}

/* Layout: una etiqueta de equipaje como encabezado, debajo la lista en una sola columna estrecha */
:root{
  --bg:#E9EEF0; --card:#FFFFFF; --ink:#13262D; --muted:#5B6B71; --line:#D3DCDF;
  --accent:#E3A21A; --accent-ink:#2A1C00; --done:#2F7D5B;
  --mafer:#9A3F72; --jorge:#1D6C8C; --on-person:#FFFFFF;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1E; --card:#17252A; --ink:#E6EEF0; --muted:#94A6AC; --line:#2A3B41;
  --accent:#F0B433; --accent-ink:#231700; --done:#5BBF8E;
  --mafer:#E58BC0; --jorge:#6CC0E3; --on-person:#0F1A1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1E; --card:#17252A; --ink:#E6EEF0; --muted:#94A6AC; --line:#2A3B41;
  --accent:#F0B433; --accent-ink:#231700; --done:#5BBF8E;
  --mafer:#E58BC0; --jorge:#6CC0E3; --on-person:#0F1A1E; color-scheme:dark}
*{box-sizing:border-box}
.cols{display:flex;justify-content:space-between;gap:12px;padding-inline:14px 52px;margin-bottom:-14px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.who{flex:none;display:flex;gap:4px}
.who button{font:inherit;font-size:13px;font-weight:700;padding:5px 9px;border-radius:99px;cursor:pointer;background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.who button[data-p="Mafer"]:hover{border-color:var(--mafer);color:var(--mafer)}
.who button[data-p="Jorge"]:hover{border-color:var(--jorge);color:var(--jorge)}
.who button[aria-pressed="true"][data-p="Mafer"]{background:var(--mafer);border-color:var(--mafer);color:var(--on-person)}
.who button[aria-pressed="true"][data-p="Jorge"]{background:var(--jorge);border-color:var(--jorge);color:var(--on-person)}
.who button:focus-visible,.add select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.split{font-size:14px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 14px}
.split b{font-weight:700}
.add select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 10px}
@media (max-width:420px){.who button{padding:5px 7px;font-size:12px}.add{flex-wrap:wrap}.add input{flex-basis:100%}.add select{flex:1}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}
.tag{position:relative;background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 14px 14px;padding:22px 22px 20px 64px;display:flex;flex-direction:column;gap:6px}
.tag::before{content:"";position:absolute;left:22px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.tag .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.75}
.tag h1{font-family:var(--f-display);font-size:clamp(28px,7vw,38px);line-height:1.05;margin:0;font-weight:800;text-wrap:balance}
.meter{display:flex;align-items:center;gap:12px;margin-top:8px}
.bar{flex:1;height:8px;border-radius:99px;background:rgba(0,0,0,.15);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent-ink);border-radius:99px;transition:width .3s ease}
.count{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
li{display:flex;align-items:center;gap:12px;padding:4px 8px 4px 14px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li label{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding-block:12px;cursor:pointer}
li input{appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;display:grid;place-content:center;cursor:pointer;margin:0;background:transparent}
li input::after{content:"";width:12px;height:7px;border-left:3px solid var(--card);border-bottom:3px solid var(--card);transform:translateY(-2px) rotate(-45deg);opacity:0}
li input:checked{background:var(--done);border-color:var(--done)}
li input:checked::after{opacity:1}
li input:focus-visible,button:focus-visible,.add input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
li .txt{overflow-wrap:anywhere}
li.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.del{flex:none;border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:8px;font-size:20px;line-height:1;cursor:pointer;opacity:.55}
.del:hover{opacity:1;background:var(--bg)}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.add button,.ghost{font:inherit;font-weight:700;border-radius:10px;padding:12px 16px;cursor:pointer}
.add button{border:0;background:var(--ink);color:var(--bg)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:400;padding:8px 12px}
.status{min-height:1.2em}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters input,.filters select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.filters input{flex:1 1 100%}
.filters select{flex:1}
.filters input:focus-visible,.filters select:focus-visible,.edit:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.filters .ghost{padding:10px 12px}
.found{color:var(--muted);font-size:14px;margin-top:-14px}
.edit{flex:none;border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:8px;font-size:17px;line-height:1;cursor:pointer;opacity:.55}
.edit:hover{opacity:1;background:var(--bg)}
li .editbox{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--accent);border-radius:8px;padding:9px 10px;margin-block:6px}
@media (max-width:480px){
  li{flex-wrap:wrap;gap:0 4px}
  li label,li .editbox{flex:1 1 calc(100% - 80px)}
  li .who{order:4;flex-basis:100%;padding:0 0 10px 38px}
  .cols{display:none}
}
li .editbox:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.pets{display:flex;justify-content:flex-end;padding-right:20px;margin-bottom:-23px;position:relative;z-index:1}
.pets svg{display:block;width:min(230px,66%);height:auto;overflow:visible}
.dog-tail{transform-origin:66px 88px;animation:wag 1.1s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(16deg)}}
@media (prefers-reduced-motion: reduce){.bar span{transition:none}.dog-tail{animation:none}}
</style>
</head>

  <header class="tag">
    <span class="eyebrow">Checklist de salida</span>
    <h1>Antes de viajar</h1>
    <div class="meter"><div class="bar"><span id="bar" style="width:0%"></span></div><span class="count" id="count">…</span></div>
    <div class="split" id="split"></div>
  </header>
  <div class="cols" aria-hidden="true"><span>Tarea</span><span>Responsable</span></div>
  <div class="filters" id="filters" role="search">
    <input id="q" type="search" placeholder="Buscar tareas" autocomplete="off" aria-label="Buscar tareas">
    <select id="fState" aria-label="Filtrar por estado"><option value="">Todas</option><option value="open">Pendientes</option><option value="done">Listas</option></select>
    <select id="fWho" aria-label="Filtrar por responsable"><option value="">Todos</option><option value="Mafer">Mafer</option><option value="Jorge">Jorge</option><option value="none">Sin asignar</option></select>
    <button class="ghost" type="button" id="clearF" hidden>Limpiar</button>
  </div>
  <div class="found" id="found" aria-live="polite" hidden></div>
  <ul id="list"></ul>
  <form class="add" id="addForm">
    <input id="newItem" type="text" placeholder="Agregar algo que no se nos puede olvidar" autocomplete="off" aria-label="Nueva tarea">
    <select id="newWho" aria-label="Responsable de la nueva tarea"><option value="">Sin asignar</option><option value="Mafer">Mafer</option><option value="Jorge">Jorge</option></select>
    <button type="submit">Agregar</button>
  </form>
  <div class="foot">
    <span class="status" id="status" aria-live="polite"></span>
    <button class="ghost" type="button" id="reset">Desmarcar todo</button>
  </div>
</div>

<script>
(function(){
  var items = [], lastJson = '', busy = 0, editingId = null;
  var PEOPLE = ['Mafer','Jorge'];
  var list = document.getElementById('list');
  var statusEl = document.getElementById('status');

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function say(t){ statusEl.textContent = t; }

  function api(method, path, body){
    return fetch('/api' + path, {
      method: method,
      headers: body ? {'Content-Type':'application/json'} : undefined,
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
  }

  var q = document.getElementById('q'), fState = document.getElementById('fState'), fWho = document.getElementById('fWho');
  function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  function filtersOn(){ return !!(q.value.trim() || fState.value || fWho.value); }
  function matches(it){
    var t = norm(q.value.trim());
    if (t && norm(it.t).indexOf(t) < 0) return false;
    if (fState.value==='open' && it.d) return false;
    if (fState.value==='done' && !it.d) return false;
    if (fWho.value==='none') return !it.r;
    if (fWho.value && it.r!==fWho.value) return false;
    return true;
  }

  function render(){
    var shown = items.filter(matches), f = filtersOn();
    var found = document.getElementById('found');
    found.hidden = !f; document.getElementById('clearF').hidden = !f;
    if (f) found.textContent = shown.length+' de '+items.length+(shown.length===1?' tarea':' tareas');
    if (!items.length){ list.innerHTML = '<li class="empty">La lista está vacía. Agrega la primera tarea abajo.</li>'; }
    else if (!shown.length){ list.innerHTML = '<li class="empty">Ninguna tarea coincide con la búsqueda o los filtros.</li>'; }
    else list.innerHTML = shown.map(function(it){
      var body = (it.id===editingId)
        ? '<input class="editbox" type="text" maxlength="200" value="'+esc(it.t)+'" aria-label="Editar tarea">'
        : '<label><input type="checkbox" id="c-'+esc(it.id)+'"'+(it.d?' checked':'')+'><span class="txt">'+esc(it.t)+'</span></label>';
      return '<li class="'+(it.d?'done':'')+'" data-id="'+esc(it.id)+'">'+body+
        '<div class="who" role="group" aria-label="Responsable">'+PEOPLE.map(function(p){
          return '<button type="button" data-p="'+p+'" aria-pressed="'+(it.r===p)+'">'+p+'</button>';
        }).join('')+'</div>'+
        '<button class="edit" type="button" aria-label="Editar: '+esc(it.t)+'">✎</button>'+
        '<button class="del" type="button" aria-label="Quitar: '+esc(it.t)+'">×</button></li>';
    }).join('');
    var ed = list.querySelector('.editbox');
    if (ed && !ed.dataset.ready){ ed.dataset.ready = 1; ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length); }
    var n = items.length, k = items.filter(function(i){return i.d;}).length;
    document.getElementById('count').textContent = (n && k===n) ? '¡Todo listo! Buen viaje' : k+' de '+n+' listo';
    document.getElementById('bar').style.width = (n ? Math.round(k/n*100) : 0)+'%';
    var parts = PEOPLE.map(function(p){
      var mine = items.filter(function(i){ return i.r===p; });
      return '<span><b>'+p+'</b> '+mine.filter(function(i){return i.d;}).length+'/'+mine.length+'</span>';
    });
    var free = items.filter(function(i){ return !i.r; }).length;
    if (free) parts.push('<span>Sin asignar '+free+'</span>');
    document.getElementById('split').innerHTML = parts.join('');
  }

  function apply(next){
    var j = JSON.stringify(next);
    if (j === lastJson) return;
    lastJson = j; items = next; if (editingId===null) render();
  }

  function load(){
    if (busy) return;
    api('GET','/items').then(function(d){ apply(d.items); say(''); })
      .catch(function(){ say('Sin conexión con el servidor. Reintentando…'); });
  }

  // Cambio local inmediato, luego se confirma con el servidor.
  function change(request){
    busy++;
    request.then(function(d){ apply(d.items); say(''); })
      .catch(function(){ say('No se pudo guardar. Revisa la conexión y vuelve a intentarlo.'); load(); })
      .then(function(){ busy--; });
  }
  function find(id){ return items.find(function(i){ return i.id===id; }); }

  list.addEventListener('change', function(e){
    var li = e.target.closest('li'); var it = li && find(li.dataset.id); if (!it) return;
    it.d = e.target.checked; render();
    change(api('PATCH','/items/'+encodeURIComponent(it.id),{d:it.d}));
  });
  list.addEventListener('click', function(e){
    var w = e.target.closest('.who button');
    if (w){
      var it = find(w.closest('li').dataset.id); if (!it) return;
      it.r = (it.r===w.dataset.p) ? '' : w.dataset.p; render();
      change(api('PATCH','/items/'+encodeURIComponent(it.id),{r:it.r}));
      return;
    }
    var ebtn = e.target.closest('.edit');
    if (ebtn){ editingId = ebtn.closest('li').dataset.id; render(); return; }
    var b = e.target.closest('.del'); if (!b) return;
    var id = b.closest('li').dataset.id;
    items = items.filter(function(i){ return i.id!==id; }); render();
    change(api('DELETE','/items/'+encodeURIComponent(id)));
  });
  function finishEdit(save){
    var id = editingId; if (id===null) return;
    var box = list.querySelector('.editbox'), it = find(id);
    var t = box ? box.value.trim() : '';
    editingId = null;
    if (save && it && t && t!==it.t){
      it.t = t; render();
      change(api('PATCH','/items/'+encodeURIComponent(id),{t:t}));
    } else { lastJson = ''; render(); load(); }
  }
  list.addEventListener('keydown', function(e){
    if (!e.target.classList.contains('editbox')) return;
    if (e.key==='Enter'){ e.preventDefault(); finishEdit(true); }
    else if (e.key==='Escape'){ e.preventDefault(); finishEdit(false); }
  });
  list.addEventListener('focusout', function(e){
    if (e.target.classList.contains('editbox') && editingId!==null) finishEdit(true);
  });
  [q, fState, fWho].forEach(function(el){ el.addEventListener('input', render); });
  document.getElementById('clearF').addEventListener('click', function(){
    q.value = ''; fState.value = ''; fWho.value = ''; render();
  });
  document.getElementById('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    var inp = document.getElementById('newItem'); var t = inp.value.trim();
    if (!t) return;
    var r = document.getElementById('newWho').value;
    inp.value = '';
    change(api('POST','/items',{t:t, r:r}));
  });
  document.getElementById('reset').addEventListener('click', function(){
    items.forEach(function(i){ i.d = false; }); render();
    change(api('POST','/reset'));
  });

  load();
  setInterval(load, 5000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
})();
</script>
</body>
</html>
